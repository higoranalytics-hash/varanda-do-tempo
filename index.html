<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211a16">
  <title>Varanda do Tempo | Acesso</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/auth.js"></script>
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-card">
      <a class="brand login-home-brand" href="index.html" aria-label="Varanda do Tempo - início">
        <img class="login-brand-logo" src="assets/logo-varanda-do-tempo.webp" width="1024" height="1024" alt="Varanda do Tempo — Petiscos e comida afetiva">
        <span class="sr-only">Varanda do Tempo</span>
      </a>
      <div class="login-heading">
        <h2>Bem-vindo!</h2>
        <p>Entre com suas credenciais para continuar.</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>
        <div id="loginMessage" class="message" role="alert"></div>
        <button type="submit" id="loginButton" class="btn btn-primary">
          <span id="buttonText">Entrar no sistema</span>
          <span id="buttonLoader" hidden>Verificando acesso...</span>
        </button>
      </form>
      <footer>Varanda do Tempo © 2026</footer>
    </section>
  </main>
</body>
</html>
